<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Product Card</title>
    <link rel="stylesheet" href="c files/product.css">
</head>
<body>
    <div class="container1">
        <div class="card">
            <img src="images/Apple.jpeg" alt="Apple product">
            <div class="card-info">
                <h3>headphones</h3>
                <p>$999.00</p>
            </div>
        </div>
        <div class="card">
            <img src="images/download.jpeg" alt="Product">
            <div class="card-info">
                <h3>iphone's</h3>
                <p>$1,099.00</p>
            </div>
        </div>
         <div class="card">
             <img src="images/Coast Team Studio 3D.jpeg" alt="Product">
             <div class="card-info">
                 <h3>speaker's</h3>
                 <p>$1,099.00</p>
            </div>
        </div>
        <div class="card">
            <img src="images/download (1).jpeg" alt="Product">
            <div class="card-info">
                <h3>macbook air</h3>
                <p>$249.00</p>
            </div>
        </div>
    </div>
</body>
</html>
